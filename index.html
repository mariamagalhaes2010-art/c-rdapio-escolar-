</html><!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🍽️ Cardápio Escolar - Administração</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f0ebe4 0%, #e2d7cb 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        /* Cards */
        .card {
            background: #fffffffa;
            backdrop-filter: blur(2px);
            border-radius: 32px;
            padding: 2rem 2.2rem;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 245, 235, 0.5);
            margin-bottom: 2rem;
            transition: 0.2s;
        }

        @media (max-width: 550px) {
            .card {
                padding: 1.5rem 1rem;
            }
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            border-bottom: 3px dashed #d9c8b2;
            padding-bottom: 0.8rem;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }

        .card-header i {
            font-size: 2rem;
            color: #c77d3a;
            background: #f3e8dc;
            padding: 0.4rem 0.7rem;
            border-radius: 50%;
        }

        .card-header h2 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #3d2c1e;
        }

        .card-header .badge {
            margin-left: auto;
            background: #efe4d8;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #4d3827;
        }

        /* Admin - área de gerenciamento */
        .admin-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .admin-row input {
            flex: 2 1 200px;
            padding: 0.8rem 1.2rem;
            border: 1px solid #d5c2b0;
            border-radius: 60px;
            font-size: 1rem;
            background: white;
            outline: none;
            transition: 0.2s;
        }

        .admin-row input:focus {
            border-color: #b56e32;
            box-shadow: 0 0 0 3px rgba(183, 106, 43, 0.15);
        }

        .admin-row button {
            padding: 0.8rem 1.8rem;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .btn-add {
            background: #ba7b46;
            color: white;
            box-shadow: 0 4px 10px rgba(144, 85, 36, 0.25);
        }
        .btn-add:hover {
            background: #a86830;
            transform: scale(1.02);
        }

        .btn-remove {
            background: #d1b9a6;
            color: #3d2c1e;
        }
        .btn-remove:hover {
            background: #c0a48b;
        }

        .btn-danger {
            background: #c0392b;
            color: white;
        }
        .btn-danger:hover {
            background: #a93226;
        }

        /* Lista de opções */
        .opcoes-lista {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            margin-top: 0.8rem;
            min-height: 50px;
        }

        .opcao-tag {
            background: #f3e8dc;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #d5c2b0;
            font-weight: 500;
            color: #3d2c1e;
        }

        .opcao-tag button {
            background: transparent;
            border: none;
            color: #8b5a3a;
            cursor: pointer;
            font-size: 1rem;
            padding: 0 2px;
            transition: 0.15s;
        }
        .opcao-tag button:hover {
            color: #c0392b;
            transform: scale(1.2);
        }

        .empty-msg {
            color: #8a7766;
            font-style: italic;
            padding: 0.5rem 0;
        }

        /* Formulário para alunos (prato dinâmico) */
        .opcoes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.9rem;
            background: #fcf9f5;
            padding: 1.2rem;
            border-radius: 28px;
            border: 1px solid #e5d6c6;
        }

        .opcao-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 0.7rem 1rem 0.7rem 1.2rem;
            border-radius: 60px;
            border: 1px solid #dbcbba;
            transition: 0.15s;
            cursor: pointer;
        }

        .opcao-item:hover {
            background: #f6efe7;
            border-color: #b9855a;
        }

        .opcao-item input[type="radio"] {
            accent-color: #b8692a;
            width: 1.1rem;
            height: 1.1rem;
            flex-shrink: 0;
            cursor: pointer;
        }

        .opcao-item label {
            font-weight: 500;
            color: #2d241b;
            cursor: pointer;
            flex: 1;
        }

        .opcao-item i {
            color: #a5764b;
            margin-right: 2px;
        }

        .opcao-item:has(input:checked) {
            background: #efe3d6;
            border-color: #b06d30;
            box-shadow: 0 0 0 1px #b06d30;
        }

        /* outros campos */
        .row-dupla {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            background: #fcf9f5;
            padding: 1.5rem;
            border-radius: 28px;
            border: 1px solid #e5d6c6;
        }

        .row-dupla .campo {
            flex: 1 1 180px;
        }

        .campo label {
            display: block;
            font-weight: 500;
            color: #4b3826;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .campo select,
        .campo input {
            width: 100%;
            padding: 0.7rem 1rem;
            background: white;
            border: 1px solid #d5c2b0;
            border-radius: 60px;
            font-size: 0.95rem;
            color: #2c1f14;
            outline: none;
            transition: 0.2s;
        }

        .campo select:focus,
        .campo input:focus {
            border-color: #b56e32;
            box-shadow: 0 0 0 3px rgba(183, 106, 43, 0.15);
        }

        .restricoes-area {
            background: #fcf9f5;
            padding: 1.5rem;
            border-radius: 28px;
            border: 1px solid #e5d6c6;
        }

        .restricoes-area textarea {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 1px solid #d5c2b0;
            border-radius: 24px;
            resize: vertical;
            min-height: 70px;
            font-size: 0.95rem;
            background: white;
            transition: 0.2s;
            color: #2f241b;
        }

        .restricoes-area textarea:focus {
            border-color: #b56e32;
            box-shadow: 0 0 0 3px rgba(183, 106, 43, 0.12);
            outline: none;
        }

        .btn-enviar {
            margin-top: 2rem;
            width: 100%;
            padding: 1rem;
            background: #ba7b46;
            border: none;
            border-radius: 60px;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 8px 16px -6px rgba(144, 85, 36, 0.3);
            transition: 0.2s;
            cursor: pointer;
        }

        .btn-enviar:hover {
            background: #a86830;
            transform: scale(1.01);
        }

        .btn-enviar:active {
            transform: scale(0.96);
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #3b2c1d;
            margin-bottom: 0.6rem;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-label i {
            color: #b0682b;
            width: 1.4rem;
        }

        .footer-info {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.85rem;
            color: #7a624c;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .footer-info i {
            color: #b67f4c;
        }

        .alert {
            padding: 0.8rem 1.2rem;
            border-radius: 40px;
            background: #f1e4d8;
            color: #4d3827;
            margin-top: 0.8rem;
            display: none;
        }

        .alert.show {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ==================== ADMIN ==================== -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-gear"></i>
                <h2>Gerenciar opções</h2>
                <span class="badge"><i class="fas fa-database"></i> localStorage</span>
            </div>

            <div class="admin-row">
                <input type="text" id="novaOpcaoInput" placeholder="Ex: Frango grelhado, Omelete, ..." />
                <button class="btn-add" id="btnAdicionarOpcao"><i class="fas fa-plus"></i> Adicionar</button>
                <button class="btn-remove" id="btnResetarOpcoes"><i class="fas fa-undo"></i> Restaurar padrão</button>
            </div>

            <div style="display: flex; gap: 0.8rem; flex-wrap: wrap; align-items: center;">
                <span style="font-weight: 500; color: #4b3826;"><i class="fas fa-list"></i> Opções disponíveis:</span>
                <div id="listaOpcoesAdmin" class="opcoes-lista">
                    <!-- preenchido via JS -->
                </div>
            </div>
            <div id="alertAdmin" class="alert"></div>
        </div>

        <!-- ==================== FORMULÁRIO DO ALUNO ==================== -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-utensils"></i>
                <h2>Peça seu almoço</h2>
                <span class="badge"><i class="far fa-calendar-alt"></i> 24/08</span>
            </div>

            <form id="formAlmoco">

                <!-- opção principal (dinâmica) -->
                <div class="form-group" style="margin-bottom: 1.8rem;">
                    <span class="form-label"><i class="fas fa-circle-check"></i> Escolha seu prato</span>
                    <div id="opcoesAluno" class="opcoes-grid">
                        <!-- preenchido via JS -->
                    </div>
                </div>

                <!-- acompanhamentos -->
                <div class="form-group" style="margin-bottom: 1.8rem;">
                    <span class="form-label"><i class="fas fa-bowl-food"></i> Acompanhamentos</span>
                    <div class="row-dupla">
                        <div class="campo">
                            <label for="acompanhamento"><i class="fas fa-utensil-spoon"></i> Acompanhamento</label>
                            <select id="acompanhamento">
                                <option value="Arroz e feijão">🍚 Arroz & feijão</option>
                                <option value="Arroz integral e lentilha">🌾 Arroz integral + lentilha</option>
                                <option value="Purê de batata">🥔 Purê de batata</option>
                                <option value="Salada verde">🥗 Salada verde</option>
                                <option value="Legumes grelhados">🥕 Legumes grelhados</option>
                            </select>
                        </div>
                        <div class="campo">
                            <label for="proteinaExtra"><i class="fas fa-plus-circle"></i> Proteína extra</label>
                            <select id="proteinaExtra">
                                <option value="Nenhum">🚫 Nenhum</option>
                                <option value="Ovo cozido">🥚 Ovo cozido</option>
                                <option value="Queijo ralado">🧀 Queijo ralado</option>
                                <option value="Frango desfiado">🍗 Frango desfiado</option>
                                <option value="Tofu">🌱 Tofu</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- restrições -->
                <div class="form-group" style="margin-bottom: 1.2rem;">
                    <span class="form-label"><i class="fas fa-triangle-exclamation"></i> Restrições / alergias</span>
                    <div class="restricoes-area">
                        <textarea id="restricoes" placeholder="Ex: alérgico a lactose, gluten, frutos do mar..."></textarea>
                    </div>
                </div>

                <!-- nome/turma -->
                <div style="display: flex; flex-wrap: wrap; gap: 1rem; background: #fcf9f5; padding: 1rem 1.5rem; border-radius: 28px; border: 1px solid #e5d6c6; margin-bottom: 0.5rem;">
                    <div style="flex: 2 1 180px;">
                        <label style="font-weight: 500; color: #4b3826; display: block; margin-bottom: 4px;"><i class="fas fa-user-graduate"></i> Nome / Turma</label>
                        <input type="text" id="nomeTurma" placeholder="Ex: Ana J. - 5º A" style="width: 100%; padding: 0.7rem 1rem; border: 1px solid #d5c2b0; border-radius: 60px; background: white; font-size: 0.95rem;" />
                    </div>
                    <div style="flex: 1 1 100px; display: flex; align-items: flex-end;">
                        <span style="background: #efe5db; padding: 0.3rem 1rem; border-radius: 40px; font-size: 0.8rem; color: #4a3523;"><i class="far fa-clock"></i> 11:30 - 13:30</span>
                    </div>
                </div>

                <button type="submit" class="btn-enviar">
                    <i class="fas fa-paper-plane"></i> Enviar pedido
                </button>

                <div class="footer-info">
                    <span><i class="fas fa-check-circle" style="color: #458b5e;"></i> Pedido registrado</span>
                    <span><i class="fas fa-rotate-left"></i> Altere até 10:00</span>
                </div>
            </form>
        </div>
    </div>

    <script>
        (function() {
            // ----- CHAVE LOCALSTORAGE -----
            const STORAGE_KEY = 'opcoesAlmocoEscolar';

            // ----- OPÇÕES PADRÃO (fallback) -----
            const DEFAULT_OPCOES = [
                'Frango grelhado',
                'Carne moída',
                'Omelete',
                'Vegetariano (grão-de-bico)',
                'Peixe assado',
                'Macarrão ao molho'
            ];

            // ----- FUNÇÕES DE PERSISTÊNCIA -----
            function getOpcoes() {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            return parsed;
                        }
                    } catch (_) { /* ignora */ }
                }
                // se não houver, salva as padrão e retorna
                setOpcoes(DEFAULT_OPCOES);
                return DEFAULT_OPCOES;
            }

            function setOpcoes(opcoesArray) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(opcoesArray));
            }

            // ----- RENDERIZAÇÃO -----
            function renderizarTudo() {
                const opcoes = getOpcoes();
                renderizarAdmin(opcoes);
                renderizarAluno(opcoes);
            }

            // Admin: lista de tags
            function renderizarAdmin(opcoes) {
                const container = document.getElementById('listaOpcoesAdmin');
                if (!container) return;

                if (opcoes.length === 0) {
                    container.innerHTML = `<span class="empty-msg"><i class="fas fa-circle-exclamation"></i> Nenhuma opção cadastrada. Adicione uma acima.</span>`;
                    return;
                }

                let html = '';
                opcoes.forEach((opcao, index) => {
                    html += `
                        <div class="opcao-tag">
                            <span>${opcao}</span>
                            <button type="button" class="btn-remover-item" data-index="${index}" title="Remover">
                                <i class="fas fa-xmark"></i>
                            </button>
                        </div>
                    `;
                });
                container.innerHTML = html;

                // eventos para os botões de remover
                document.querySelectorAll('.btn-remover-item').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        const index = parseInt(this.dataset.index, 10);
                        removerOpcao(index);
                    });
                });
            }

            // Aluno: opções em forma de radio
            function renderizarAluno(opcoes) {
                const container = document.getElementById('opcoesAluno');
                if (!container) return;

                if (opcoes.length === 0) {
                    container.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#7a624c; padding:1rem;">
                        <i class="fas fa-triangle-exclamation"></i> Nenhuma opção disponível hoje.
                    </div>`;
                    return;
                }

                let html = '';
                opcoes.forEach((opcao, index) => {
                    const id = `opcao_${index}`;
                    const checked = index === 0 ? 'checked' : '';
                    html += `
                        <div class="opcao-item">
                            <input type="radio" name="refeicao" id="${id}" value="${opcao}" ${checked}>
                            <label for="${id}"><i class="fas fa-utensil-spoon"></i> ${opcao}</label>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }

            // ----- AÇÕES ADMIN -----
            function adicionarOpcao() {
                const input = document.getElementById('novaOpcaoInput');
                const valor = input.value.trim();
                if (!valor) {
                    mostrarAlerta('Digite o nome da opção.', 'warning');
                    return;
                }

                const opcoes = getOpcoes();
                if (opcoes.includes(valor)) {
                    mostrarAlerta(`"${valor}" já está na lista.`, 'warning');
                    return;
                }

                opcoes.push(valor);
                setOpcoes(opcoes);
                renderizarTudo();
                input.value = '';
                mostrarAlerta(`"${valor}" adicionado com sucesso!`, 'success');
            }

            function removerOpcao(index) {
                let opcoes = getOpcoes();
                if (index < 0 || index >= opcoes.length) return;
                const removido = opcoes[index];
                opcoes.splice(index, 1);
                setOpcoes(opcoes);
                renderizarTudo();
                mostrarAlerta(`"${removido}" removido.`, 'info');
            }

            function resetarOpcoes() {
                setOpcoes(DEFAULT_OPCOES);
                renderizarTudo();
                mostrarAlerta('Opções restauradas para o padrão.', 'success');
            }

            // ----- ALERTA -----
            function mostrarAlerta(mensagem, tipo = 'info') {
                const alertDiv = document.getElementById('alertAdmin');
                if (!alertDiv) return;
                alertDiv.textContent = mensagem;
                alertDiv.className = 'alert show';
                alertDiv.style.background = tipo === 'success' ? '#d4edc9' :
                                            tipo === 'warning' ? '#f5e6d3' :
                                            '#e8e0d8';
                clearTimeout(alertDiv._timer);
                alertDiv._timer = setTimeout(() => {
                    alertDiv.classList.remove('show');
                }, 3500);
            }

            // ----- ENVIO DO FORMULÁRIO (aluno) -----
            function configurarFormulario() {
                const form = document.getElementById('formAlmoco');
                form.addEventListener('submit', function(e) {
                    e.preventDefault();

                    const opcoes = getOpcoes();
                    const radioSelecionado = document.querySelector('input[name="refeicao"]:checked');
                    const prato = radioSelecionado ? radioSelecionado.value : 'Nenhum selecionado';

                    const acompanhamento = document.getElementById('acompanhamento').value;
                    const proteinaExtra = document.getElementById('proteinaExtra').value;
                    const restricoes = document.getElementById('restricoes').value.trim() || 'Nenhuma';
                    const nomeTurma = document.getElementById('nomeTurma').value.trim() || 'Não informado';

                    let msg = '🍽️ PEDIDO DE ALMOÇO\n';
                    msg += '━━━━━━━━━━━━━━━━\n';
                    msg += `👤 ${nomeTurma}\n`;
                    msg += `🍛 ${prato}\n`;
                    msg += `🍚 ${acompanhamento}\n`;
                    msg += `🥩 ${proteinaExtra}\n`;
                    msg += `⚠️ ${restricoes}\n`;
                    msg += '━━━━━━━━━━━━━━━━\n';
                    msg += '✅ Pedido registrado!';

                    alert(msg);
                });
            }

            // ----- INICIALIZAÇÃO -----
            function init() {
                // garante que exista opções no storage
                getOpcoes();

                renderizarTudo();
                configurarFormulario();

                // eventos dos botões admin
                document.getElementById('btnAdicionarOpcao').addEventListener('click', adicionarOpcao);
                document.getElementById('btnResetarOpcoes').addEventListener('click', resetarOpcoes);

                // Enter no input de nova opção
                document.getElementById('novaOpcaoInput').addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        adicionarOpcao();
                    }
                });
            }

            init();
        })();
    </script>

</body>
</html>

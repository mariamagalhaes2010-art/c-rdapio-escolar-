<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔵 Cardápio Escolar - Administração</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #dce6f5 0%, #b3c9e8 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 960px;
            width: 100%;
        }

        /* Cards */
        .card {
            background: #eaf1fd;
            backdrop-filter: blur(2px);
            border-radius: 32px;
            padding: 2rem 2.2rem;
            box-shadow: 0 20px 40px -12px rgba(0, 40, 80, 0.25);
            border: 1px solid rgba(70, 130, 200, 0.25);
            margin-bottom: 2rem;
            transition: 0.2s;
        }

        @media (max-width: 550px) {
            .card {
                padding: 1.5rem 1rem;
            }
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            border-bottom: 3px dashed #7a9fd4;
            padding-bottom: 0.8rem;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }

        .card-header i {
            font-size: 2rem;
            color: #1a4b8c;
            background: #c5d8f0;
            padding: 0.4rem 0.7rem;
            border-radius: 50%;
        }

        .card-header h2 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #0a2a5c;
        }

        .card-header .badge {
            margin-left: auto;
            background: #b8cce6;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #103a6b;
        }

        /* Admin - área de gerenciamento */
        .admin-section {
            background: #dae6f7;
            border-radius: 20px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.2rem;
            border: 1px solid #7a9fd4;
        }

        .admin-section h3 {
            color: #0a2a5c;
            font-size: 1rem;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-section h3 i {
            color: #1a4b8c;
        }

        .admin-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
        }

        .admin-row input {
            flex: 2 1 180px;
            padding: 0.7rem 1.2rem;
            border: 2px solid #7a9fd4;
            border-radius: 60px;
            font-size: 0.95rem;
            background: white;
            outline: none;
            transition: 0.2s;
        }

        .admin-row input:focus {
            border-color: #1a4b8c;
            box-shadow: 0 0 0 3px rgba(26, 75, 140, 0.2);
        }

        .admin-row button {
            padding: 0.7rem 1.6rem;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .btn-add {
            background: #1a4b8c;
            color: white;
            box-shadow: 0 4px 10px rgba(26, 75, 140, 0.3);
        }
        .btn-add:hover {
            background: #0f3a70;
            transform: scale(1.02);
        }

        .btn-reset {
            background: #5a7fb0;
            color: white;
        }
        .btn-reset:hover {
            background: #3d6290;
        }

        .btn-remover-item {
            background: #b0c8e5;
            color: #0a2a5c;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
        }
        .btn-remover-item:hover {
            background: #c0392b;
            color: white;
        }

        /* Lista de opções (tags) */
        .opcoes-lista {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 0.5rem;
            min-height: 40px;
        }

        .opcao-tag {
            background: white;
            padding: 0.4rem 1rem 0.4rem 1.2rem;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 2px solid #7a9fd4;
            font-weight: 500;
            color: #0a2a5c;
            font-size: 0.9rem;
        }

        .opcao-tag button {
            background: transparent;
            border: none;
            color: #4a6f9e;
            cursor: pointer;
            font-size: 1rem;
            padding: 0 2px;
            transition: 0.15s;
            display: flex;
            align-items: center;
        }
        .opcao-tag button:hover {
            color: #c0392b;
            transform: scale(1.2);
        }

        .empty-msg {
            color: #4a6f9e;
            font-style: italic;
            padding: 0.3rem 0;
        }

        /* Formulário para alunos */
        .opcoes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.8rem;
            background: #dae6f7;
            padding: 1.2rem;
            border-radius: 28px;
            border: 1px solid #7a9fd4;
        }

        .opcao-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 0.6rem 1rem 0.6rem 1.2rem;
            border-radius: 60px;
            border: 2px solid #b0c8e5;
            transition: 0.15s;
            cursor: pointer;
        }

        .opcao-item:hover {
            background: #eaf1fd;
            border-color: #1a4b8c;
        }

        .opcao-item input[type="radio"] {
            accent-color: #1a4b8c;
            width: 1.1rem;
            height: 1.1rem;
            flex-shrink: 0;
            cursor: pointer;
        }

        .opcao-item label {
            font-weight: 500;
            color: #0a2a5c;
            cursor: pointer;
            flex: 1;
            font-size: 0.95rem;
        }

        .opcao-item i {
            color: #1a4b8c;
            margin-right: 2px;
        }

        .opcao-item:has(input:checked) {
            background: #b8cce6;
            border-color: #1a4b8c;
            box-shadow: 0 0 0 2px #1a4b8c;
        }

        /* Campos editáveis (acompanhamentos e proteínas) */
        .campos-editaveis {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            background: #dae6f7;
            padding: 1.5rem;
            border-radius: 28px;
            border: 1px solid #7a9fd4;
        }

        .campos-editaveis .campo {
            flex: 1 1 200px;
        }

        .campo label {
            display: block;
            font-weight: 600;
            color: #0a2a5c;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .campo select {
            width: 100%;
            padding: 0.7rem 1rem;
            background: white;
            border: 2px solid #7a9fd4;
            border-radius: 60px;
            font-size: 0.95rem;
            color: #0a2a5c;
            outline: none;
            transition: 0.2s;
            cursor: pointer;
        }

        .campo select:focus {
            border-color: #1a4b8c;
            box-shadow: 0 0 0 3px rgba(26, 75, 140, 0.2);
        }

        .campo .admin-mini {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .campo .admin-mini input {
            flex: 2 1 100px;
            padding: 0.4rem 0.8rem;
            border: 2px solid #7a9fd4;
            border-radius: 60px;
            font-size: 0.8rem;
            background: white;
            outline: none;
        }

        .campo .admin-mini input:focus {
            border-color: #1a4b8c;
        }

        .campo .admin-mini button {
            padding: 0.3rem 1rem;
            border: none;
            border-radius: 60px;
            background: #1a4b8c;
            color: white;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.15s;
        }
        .campo .admin-mini button:hover {
            background: #0f3a70;
        }

        .campo .tags-mini {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }

        .campo .tags-mini .tag-mini {
            background: white;
            padding: 0.15rem 0.7rem 0.15rem 0.9rem;
            border-radius: 40px;
            border: 1.5px solid #7a9fd4;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #0a2a5c;
        }

        .campo .tags-mini .tag-mini button {
            background: transparent;
            border: none;
            color: #4a6f9e;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0 2px;
        }
        .campo .tags-mini .tag-mini button:hover {
            color: #c0392b;
        }

        /* Restrições */
        .restricoes-area {
            background: #dae6f7;
            padding: 1.5rem;
            border-radius: 28px;
            border: 1px solid #7a9fd4;
        }

        .restricoes-area textarea {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 2px solid #7a9fd4;
            border-radius: 24px;
            resize: vertical;
            min-height: 70px;
            font-size: 0.95rem;
            background: white;
            transition: 0.2s;
            color: #0a2a5c;
            outline: none;
        }

        .restricoes-area textarea:focus {
            border-color: #1a4b8c;
            box-shadow: 0 0 0 3px rgba(26, 75, 140, 0.15);
        }

        .btn-enviar {
            margin-top: 2rem;
            width: 100%;
            padding: 1rem;
            background: #1a4b8c;
            border: none;
            border-radius: 60px;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 8px 16px -6px rgba(26, 75, 140, 0.35);
            transition: 0.2s;
            cursor: pointer;
        }

        .btn-enviar:hover {
            background: #0f3a70;
            transform: scale(1.01);
        }

        .btn-enviar:active {
            transform: scale(0.96);
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #0a2a5c;
            margin-bottom: 0.6rem;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-label i {
            color: #1a4b8c;
            width: 1.4rem;
        }

        .footer-info {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.85rem;
            color: #2a4a7a;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .footer-info i {
            color: #1a4b8c;
        }

        .alert {
            padding: 0.7rem 1.2rem;
            border-radius: 40px;
            background: #b8cce6;
            color: #0a2a5c;
            margin-top: 0.8rem;
            display: none;
            font-weight: 500;
        }

        .alert.show {
            display: block;
        }

        /* Divisor */
        .divider {
            border: none;
            border-top: 2px dotted #7a9fd4;
            margin: 1.5rem 0;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ==================== ADMIN ==================== -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-gear"></i>
                <h2>Gerenciar Cardápio</h2>
                <span class="badge"><i class="fas fa-database"></i> localStorage</span>
            </div>

            <!-- PRATOS PRINCIPAIS -->
            <div class="admin-section">
                <h3><i class="fas fa-utensils"></i> Pratos principais</h3>
                <div class="admin-row">
                    <input type="text" id="novaOpcaoInput" placeholder="Ex: Frango grelhado, Omelete..." />
                    <button class="btn-add" id="btnAdicionarOpcao"><i class="fas fa-plus"></i> Adicionar</button>
                    <button class="btn-reset" id="btnResetarOpcoes"><i class="fas fa-undo"></i> Padrão</button>
                </div>
                <div id="listaOpcoesAdmin" class="opcoes-lista"></div>
            </div>

            <!-- ACOMPANHAMENTOS -->
            <div class="admin-section">
                <h3><i class="fas fa-bowl-food"></i> Acompanhamentos</h3>
                <div class="admin-row">
                    <input type="text" id="novoAcompanhamentoInput" placeholder="Ex: Arroz, Salada..." />
                    <button class="btn-add" id="btnAdicionarAcompanhamento"><i class="fas fa-plus"></i> Adicionar</button>
                    <button class="btn-reset" id="btnResetarAcompanhamentos"><i class="fas fa-undo"></i> Padrão</button>
                </div>
                <div id="listaAcompanhamentosAdmin" class="opcoes-lista"></div>
            </div>

            <!-- PROTEÍNAS EXTRAS -->
            <div class="admin-section">
                <h3><i class="fas fa-plus-circle"></i> Proteínas extras</h3>
                <div class="admin-row">
                    <input type="text" id="novaProteinaInput" placeholder="Ex: Ovo, Queijo..." />
                    <button class="btn-add" id="btnAdicionarProteina"><i class="fas fa-plus"></i> Adicionar</button>
                    <button class="btn-reset" id="btnResetarProteinas"><i class="fas fa-undo"></i> Padrão</button>
                </div>
                <div id="listaProteinasAdmin" class="opcoes-lista"></div>
            </div>

            <div id="alertAdmin" class="alert"></div>
        </div>

        <!-- ==================== FORMULÁRIO DO ALUNO ==================== -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-utensils"></i>
                <h2>Peça seu almoço</h2>
                <span class="badge"><i class="far fa-calendar-alt"></i> Hoje</span>
            </div>

            <form id="formAlmoco">

                <!-- Prato principal (dinâmico) -->
                <div class="form-group" style="margin-bottom: 1.8rem;">
                    <span class="form-label"><i class="fas fa-circle-check"></i> Escolha seu prato</span>
                    <div id="opcoesAluno" class="opcoes-grid">
                        <!-- preenchido via JS -->
                    </div>
                </div>

                <!-- Acompanhamentos e Proteínas (dinâmicos) -->
                <div class="form-group" style="margin-bottom: 1.8rem;">
                    <span class="form-label"><i class="fas fa-bowl-food"></i> Acompanhamentos & extras</span>
                    <div class="campos-editaveis">
                        <div class="campo">
                            <label for="acompanhamento"><i class="fas fa-utensil-spoon"></i> Acompanhamento</label>
                            <select id="acompanhamento"></select>
                        </div>
                        <div class="campo">
                            <label for="proteinaExtra"><i class="fas fa-plus-circle"></i> Proteína extra</label>
                            <select id="proteinaExtra"></select>
                        </div>
                    </div>
                </div>

                <!-- Restrições -->
                <div class="form-group" style="margin-bottom: 1.2rem;">
                    <span class="form-label"><i class="fas fa-triangle-exclamation"></i> Restrições / alergias</span>
                    <div class="restricoes-area">
                        <textarea id="restricoes" placeholder="Ex: alérgico a lactose, gluten, frutos do mar..."></textarea>
                    </div>
                </div>

                <!-- Nome/Turma -->
                <div style="display: flex; flex-wrap: wrap; gap: 1rem; background: #dae6f7; padding: 1rem 1.5rem; border-radius: 28px; border: 1px solid #7a9fd4; margin-bottom: 0.5rem;">
                    <div style="flex: 2 1 180px;">
                        <label style="font-weight: 600; color: #0a2a5c; display: block; margin-bottom: 4px;"><i class="fas fa-user-graduate"></i> Nome / Turma</label>
                        <input type="text" id="nomeTurma" placeholder="Ex: Ana J. - 5º A" style="width: 100%; padding: 0.7rem 1rem; border: 2px solid #7a9fd4; border-radius: 60px; background: white; font-size: 0.95rem; outline: none;" />
                    </div>
                    <div style="flex: 1 1 100px; display: flex; align-items: flex-end;">
                        <span style="background: #b8cce6; padding: 0.3rem 1rem; border-radius: 40px; font-size: 0.8rem; color: #0a2a5c;"><i class="far fa-clock"></i> 11:30 - 13:30</span>
                    </div>
                </div>

                <button type="submit" class="btn-enviar">
                    <i class="fas fa-paper-plane"></i> Enviar pedido
                </button>

                <div class="footer-info">
                    <span><i class="fas fa-check-circle" style="color: #1a6b3c;"></i> Pedido registrado</span>
                    <span><i class="fas fa-rotate-left"></i> Altere até 10:00</span>
                </div>
            </form>
        </div>
    </div>

    <script>
        (function() {
            // ----- CHAVES LOCALSTORAGE -----
            const STORAGE_PRATOS = 'opcoesPratos';
            const STORAGE_ACOMP = 'opcoesAcompanhamentos';
            const STORAGE_PROT = 'opcoesProteinas';

            // ----- VALORES PADRÃO -----
            const DEFAULT_PRATOS = ['Frango grelhado', 'Carne moída', 'Omelete', 'Vegetariano', 'Peixe assado', 'Macarrão'];
            const DEFAULT_ACOMP = ['Arroz e feijão', 'Arroz integral e lentilha', 'Purê de batata', 'Salada verde', 'Legumes grelhados'];
            const DEFAULT_PROT = ['Nenhum', 'Ovo cozido', 'Queijo ralado', 'Frango desfiado', 'Tofu'];

            // ----- FUNÇÕES DE PERSISTÊNCIA -----
            function getLista(chave, padrao) {
                const stored = localStorage.getItem(chave);
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            return parsed;
                        }
                    } catch (_) {}
                }
                setLista(chave, padrao);
                return padrao;
            }

            function setLista(chave, lista) {
                localStorage.setItem(chave, JSON.stringify(lista));
            }

            // ----- RENDERIZAÇÃO GERAL -----
            function renderizarTudo() {
                renderizarPratos();
                renderizarAcompanhamentos();
                renderizarProteinas();
                renderizarFormAluno();
            }

            // ----- RENDER: PRATOS (Admin + Aluno) -----
            function renderizarPratos() {
                const opcoes = getLista(STORAGE_PRATOS, DEFAULT_PRATOS);
                // Admin
                const containerAdmin = document.getElementById('listaOpcoesAdmin');
                if (containerAdmin) {
                    if (opcoes.length === 0) {
                        containerAdmin.innerHTML = `<span class="empty-msg"><i class="fas fa-circle-exclamation"></i> Nenhum prato cadastrado.</span>`;
                    } else {
                        containerAdmin.innerHTML = opcoes.map((item, i) =>
                            `<span class="opcao-tag">${item} <button class="btn-remover-item" data-lista="pratos" data-index="${i}"><i class="fas fa-xmark"></i></button></span>`
                        ).join('');
                    }
                }
                // Aluno (formulário)
                const containerAluno = document.getElementById('opcoesAluno');
                if (containerAluno) {
                    if (opcoes.length === 0) {
                        containerAluno.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#4a6f9e; padding:1rem;">
                            <i class="fas fa-triangle-exclamation"></i> Nenhuma opção disponível.
                        </div>`;
                    } else {
                        containerAluno.innerHTML = opcoes.map((item, i) =>
                            `<div class="opcao-item">
                                <input type="radio" name="refeicao" id="opcao_${i}" value="${item}" ${i === 0 ? 'checked' : ''}>
                                <label for="opcao_${i}"><i class="fas fa-utensil-spoon"></i> ${item}</label>
                            </div>`
                        ).join('');
                    }
                }
            }

            // ----- RENDER: ACOMPANHAMENTOS (Admin + select) -----
            function renderizarAcompanhamentos() {
                const opcoes = getLista(STORAGE_ACOMP, DEFAULT_ACOMP);
                // Admin
                const containerAdmin = document.getElementById('listaAcompanhamentosAdmin');
                if (containerAdmin) {
                    if (opcoes.length === 0) {
                        containerAdmin.innerHTML = `<span class="empty-msg"><i class="fas fa-circle-exclamation"></i> Nenhum acompanhamento.</span>`;
                    } else {
                        containerAdmin.innerHTML = opcoes.map((item, i) =>
                            `<span class="opcao-tag">${item} <button class="btn-remover-item" data-lista="acomp" data-index="${i}"><i class="fas fa-xmark"></i></button></span>`
                        ).join('');
                    }
                }
                // Select do formulário
                const select = document.getElementById('acompanhamento');
                if (select) {
                    select.innerHTML = opcoes.map(item => `<option value="${item}">${item}</option>`).join('');
                }
            }

            // ----- RENDER: PROTEÍNAS (Admin + select) -----
            function renderizarProteinas() {
                const opcoes = getLista(STORAGE_PROT, DEFAULT_PROT);
                // Admin
                const containerAdmin = document.getElementById('listaProteinasAdmin');
                if (containerAdmin) {
                    if (opcoes.length === 0) {
                        containerAdmin.innerHTML = `<span class="empty-msg"><i class="fas fa-circle-exclamation"></i> Nenhuma proteína extra.</span>`;
                    } else {
                        containerAdmin.innerHTML = opcoes.map((item, i) =>
                            `<span class="opcao-tag">${item} <button class="btn-remover-item" data-lista="prot" data-index="${i}"><i class="fas fa-xmark"></i></button></span>`
                        ).join('');
                    }
                }
                // Select do formulário
                const select = document.getElementById('proteinaExtra');
                if (select) {
                    select.innerHTML = opcoes.map(item => `<option value="${item}">${item}</option>`).join('');
                }
            }

            // ----- RENDER: formulário aluno (chama todos) -----
            function renderizarFormAluno() {
                renderizarPratos();
                renderizarAcompanhamentos();
                renderizarProteinas();
            }

            // ----- FUNÇÕES DE MANIPULAÇÃO -----
            function adicionarItem(chave, padrao, inputId, alertMsg) {
                const input = document.getElementById(inputId);
                const valor = input.value.trim();
                if (!valor) {
                    mostrarAlerta('Digite um nome válido.', 'warning');
                    return;
                }
                const lista = getLista(chave, padrao);
                if (lista.includes(valor)) {
                    mostrarAlerta(`"${valor}" já existe.`, 'warning');
                    return;
                }
                lista.push(valor);
                setLista(chave, lista);
                renderizarTudo();
                input.value = '';
                mostrarAlerta(`"${valor}" adicionado!`, 'success');
            }

            function removerItem(chave, padrao, index) {
                const lista = getLista(chave, padrao);
                if (index < 0 || index >= lista.length) return;
                const removido = lista[index];
                lista.splice(index, 1);
                setLista(chave, lista);
                renderizarTudo();
                mostrarAlerta(`"${removido}" removido.`, 'info');
            }

            function resetarLista(chave, padrao, msg) {
                setLista(chave, padrao);
                renderizarTudo();
                mostrarAlerta(msg, 'success');
            }

            // ----- ALERTA -----
            function mostrarAlerta(mensagem, tipo = 'info') {
                const alertDiv = document.getElementById('alertAdmin');
                if (!alertDiv) return;
                alertDiv.textContent = mensagem;
                alertDiv.className = 'alert show';
                alertDiv.style.background = tipo === 'success' ? '#b8d4b8' :
                                            tipo === 'warning' ? '#d4c9b8' :
                                            '#b8cce6';
                clearTimeout(alertDiv._timer);
                alertDiv._timer = setTimeout(() => {
                    alertDiv.classList.remove('show');
                }, 3000);
            }

            // ----- CONFIGURAR EVENTOS (delegação para botões remover) -----
            function configurarEventosRemocao() {
                document.querySelectorAll('.btn-remover-item').forEach(btn => {
                    btn.removeEventListener('click', handleRemover);
                    btn.addEventListener('click', handleRemover);
                });
            }

            function handleRemover(e) {
                const btn = e.currentTarget;
                const lista = btn.dataset.lista;
                const index = parseInt(btn.dataset.index, 10);
                if (lista === 'pratos') removerItem(STORAGE_PRATOS, DEFAULT_PRATOS, index);
                else if (lista === 'acomp') removerItem(STORAGE_ACOMP, DEFAULT_ACOMP, index);
                else if (lista === 'prot') removerItem(STORAGE_PROT, DEFAULT_PROT, index);
            }

            // ----- ENVIO DO FORMULÁRIO -----
            function configurarFormulario() {
                const form = document.getElementById('formAlmoco');
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const radio = document.querySelector('input[name="refeicao"]:checked');
                    const prato = radio ? radio.value : 'Nenhum';
                    const acompanhamento = document.getElementById('acompanhamento').value;
                    const proteina = document.getElementById('proteinaExtra').value;
                    const restricoes = document.getElementById('restricoes').value.trim() || 'Nenhuma';
                    const nome = document.getElementById('nomeTurma').value.trim() || 'Não informado';

                    alert(`🍽️ PEDIDO\n━━━━━━━━━━━\n👤 ${nome}\n🍛 ${prato}\n🍚 ${acompanhamento}\n🥩 ${proteina}\n⚠️ ${restricoes}\n━━━━━━━━━━━\n✅ Registrado!`);
                });
            }

            // ----- INICIALIZAÇÃO -----
            function init() {
                // Garante dados iniciais
                getLista(STORAGE_PRATOS, DEFAULT_PRATOS);
                getLista(STORAGE_ACOMP, DEFAULT_ACOMP);
                getLista(STORAGE_PROT, DEFAULT_PROT);

                renderizarTudo();
                configurarFormulario();

                // Eventos dos botões de adicionar
                document.getElementById('btnAdicionarOpcao').addEventListener('click', () =>
                    adicionarItem(STORAGE_PRATOS, DEFAULT_PRATOS, 'novaOpcaoInput', 'Prato adicionado!')
                );
                document.getElementById('btnAdicionarAcompanhamento').addEventListener('click', () =>
                    adicionarItem(STORAGE_ACOMP, DEFAULT_ACOMP, 'novoAcompanhamentoInput', 'Acompanhamento adicionado!')
                );
                document.getElementById('btnAdicionarProteina').addEventListener('click', () =>
                    adicionarItem(STORAGE_PROT, DEFAULT_PROT, 'novaProteinaInput', 'Proteína adicionada!')
                );

                // Reset
                document.getElementById('btnResetarOpcoes').addEventListener('click', () =>
                    resetarLista(STORAGE_PRATOS, DEFAULT_PRATOS, 'Pratos restaurados para o padrão!')
                );
                document.getElementById('btnResetarAcompanhamentos').addEventListener('click', () =>
                    resetarLista(STORAGE_ACOMP, DEFAULT_ACOMP, 'Acompanhamentos restaurados!')
                );
                document.getElementById('btnResetarProteinas').addEventListener('click', () =>
                    resetarLista(STORAGE_PROT, DEFAULT_PROT, 'Proteínas restauradas!')
                );

                // Enter nos inputs
                document.getElementById('novaOpcaoInput').addEventListener('keypress', e => {
                    if (e.key === 'Enter') { e.preventDefault();
                        document.getElementById('btnAdicionarOpcao').click(); }
                });
                document.getElementById('novoAcompanhamentoInput').addEventListener('keypress', e => {
                    if (e.key === 'Enter') { e.preventDefault();
                        document.getElementById('btnAdicionarAcompanhamento').click(); }
                });
                document.getElementById('novaProteinaInput').addEventListener('keypress', e => {
                    if (e.key === 'Enter') { e.preventDefault();
                        document.getElementById('btnAdicionarProteina').click(); }
                });

                // Delegação para remoção (porque os itens são recriados)
                document.addEventListener('click', function(e) {
                    const btn = e.target.closest('.btn-remover-item');
                    if (btn) {
                        const lista = btn.dataset.lista;
                        const index = parseInt(btn.dataset.index, 10);
                        if (lista === 'pratos') removerItem(STORAGE_PRATOS, DEFAULT_PRATOS, index);
                        else if (lista === 'acomp') removerItem(STORAGE_ACOMP, DEFAULT_ACOMP, index);
                        else if (lista === 'prot') removerItem(STORAGE_PROT, DEFAULT_PROT, index);
                    }
                });
            }

            init();
        })();
    </script>

</body>
</html>
